[project]
name = "odoo-mcp"
version = "0.1.0"
description = "MCP server that gives AI agents safe, typed access to Odoo ERP: guarded reads, analytics and human-confirmed writes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.14.4",
]

[project.scripts]
odoo-mcp = "odoo_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 130
